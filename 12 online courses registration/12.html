<!DOCTYPE html>
<html>
<head>
    <title>Online Course Registration</title>
</head>
<body>
    <h1>Online Course Registration Form</h1>

    <form action="submit_course.php" method="post" target="_self">
        <input type="hidden" name="form_type" value="Online Course Registration">

        <label for="name">Student Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" placeholder="example@mail.com" required><br><br>

        <label for="mobile">Mobile Number:</label><br>
        <input type="tel" id="mobile" name="mobile" placeholder="1234567890" required><br><br>

        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age"><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label><br><br>

        <label>Skills:</label><br>
        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML</label>
        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css">CSS</label>
        <input type="checkbox" id="js" name="skills" value="JavaScript">
        <label for="js">JavaScript</label>
        <input type="checkbox" id="python" name="skills" value="Python">
        <label for="python">Python</label><br><br>

        <label for="course">Select Course:</label><br>
        <select id="course" name="course" required>
            <option value="">--Choose a Course--</option>
            <option value="web_dev">Web Development</option>
            <option value="python">Python Programming</option>
            <option value="data_analytics">Data Analytics</option>
            <option value="digital_marketing">Digital Marketing</option>
        </select><br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob"><br><br>

        <label for="time">Preferred Class Time:</label><br>
        <input type="time" id="time" name="time"><br><br>

        <label for="address">Address / Additional Info:</label><br>
        <textarea id="address" name="address" rows="4" cols="30"></textarea><br><br>

        <label for="file">Upload Document / Photo:</label><br>
        <input type="file" id="file" name="file"><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>
</html>

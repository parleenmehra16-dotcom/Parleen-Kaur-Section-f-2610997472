<!DOCTYPE html><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Online Course Registration</title>
</head>
<body>

<div class="form-box">
<h1>Online Course Registration</h1>

<!-- Task 1: form with action, target -->
<form action="submit.html" target="_blank" method="post" enctype="multipart/form-data">

  <!-- Task 7: hidden input -->
  <input type="hidden" name="form_type" value="Online Course Registration">
<br>
  <!-- Task 2 & 3 & 11 -->
  <label for="sname">Student Name *</label>
  <input type="text" id="sname" name="sname" placeholder="Enter your full name" required>
<br>
  <label for="email">Email Address *</label>
  <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
<br>
  <label for="mobile">Mobile Number *</label>
  <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
<br>
  <label for="age">Age</label>
  <input type="number" id="age" name="age" placeholder="Enter your age" min="10" max="60">

  <label for="pass">Password *</label>
  <input type="password" id="pass" name="password" placeholder="Create password" required>
<br>
  <!-- Task 4: Gender radio same name -->
  <label>Gender *</label>
  <div class="radio-group">
    <input type="radio" id="male" name="gender" value="Male" class="inline" required>
    <label for="male">Male</label>
<br>
    <input type="radio" id="female" name="gender" value="Female" class="inline" required>
    <label for="female">Female</label>
<br>
    <input type="radio" id="other" name="gender" value="Other" class="inline" required>
    <label for="other">Other</label>
  </div>
<br>
  <!-- Task 5: Skills checkboxes -->
  <label>Skills</label>
  <div class="check-group">
    <input type="checkbox" id="html" name="skills" value="HTML" class="inline">
    <label for="html">HTML</label>
<br>
    <input type="checkbox" id="css" name="skills" value="CSS" class="inline">
    <label for="css">CSS</label>
<br>
    <input type="checkbox" id="js" name="skills" value="JavaScript" class="inline">
    <label for="js">JavaScript</label>
<br>
    <input type="checkbox" id="py" name="skills" value="Python" class="inline">
    <label for="py">Python</label>
  </div>
<br>
  <!-- Task 6: drop-down mandatory -->
  <label for="course">Select Course *</label>
  <select id="course" name="course" required>
    <option value="">-- Select Course --</option>
    <option value="Web Development">Web Development</option>
    <option value="Python Programming">Python Programming</option>
    <option value="Data Analytics">Data Analytics</option>
    <option value="Digital Marketing">Digital Marketing</option>
  </select>
<br>
  <!-- Task 8: date and time -->
  <label for="dob">Date of Birth</label>
  <input type="date" id="dob" name="dob">
<br>
  <label for="ctime">Preferred Class Time</label>
  <input type="time" id="ctime" name="class_time">
<br>
  <!-- Task 9: textarea -->
  <label for="address">Address / Additional Information</label>
  <textarea id="address" name="address" rows="4" placeholder="Enter your address and any additional information"></textarea>
<br>
  <!-- Task 10: file upload -->
  <label for="file">Upload Document / Photograph</label>
  <input type="file" id="file" name="document">
<br>
  <!-- Task 12: Submit and Reset -->
  <input type="submit" value="Submit" class="btn submit">
  <input type="reset" value="Reset" class="btn reset">

</form>
</div>

</body>
</html>

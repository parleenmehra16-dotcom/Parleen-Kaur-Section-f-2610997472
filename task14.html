<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Readers' Haven - Book Registration & Order Form</title>
</head>
<body>

<div class="form-box">
<h1>Readers' Haven - Book Registration & Order Form</h1>

<!-- Task 1: form with action, target -->
<form action="order.html" target="_blank" method="post" enctype="multipart/form-data">

 <!-- Task 9: hidden input -->
 <input type="hidden" name="order_type" value="Readers Haven Book Order">

 <!-- Task 2: Customer fields -->
 <label for="cname">Customer Name</label>
 <input type="text" id="cname" name="cname" placeholder="Enter your full name" required><br>


 <label for="email">Email Address</label>
 <input type="email" id="email" name="email" placeholder="example@gmail.com" required> <br>

 <label for="mobile">Mobile Number</label>
 <input type="tel" id="mobile" name="mobile" placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}" required> <br>

 <label for="age">Age</label>
 <input type="number" id="age" name="age" placeholder="Enter your age" min="10" max="100"><br

 <label for="pass">Password</label>
 <input type="password" id="pass" name="password" placeholder="Create a password" required><br>


 <!-- Task 4: Delivery Date and Time -->
 <label for="ddate">Delivery Date</label>
 <input type="date" id="ddate" name="delivery_date" required><br>


 <label for="dtime">Preferred Delivery Time</label>
 <input type="time" id="dtime" name="delivery_time"><br>


 <!-- Task 5: Favorite Book Category dropdown required -->
 <label for="category">Favorite Book Category *</label>
 <select id="category" name="category" required>
   <option value="">-- Select Category --</option>
   <option value="Fiction">Fiction</option>
   <option value="Science">Science</option>
   <option value="History">History</option>
   <option value="Children's Books">Children's Books</option>
 </select> <br>

 <!-- Task 6: Book Title and Quantity -->
 <label for="btitle">Book Title</label>
 <input type="text" id="btitle" name="book_title" placeholder="Enter book title" required> <br>

 <label for="qty">Quantity</label>
 <input type="number" id="qty" name="quantity" min="1" value="1" required> <br>

 <!-- Task 7: Payment Method radio -->
 <label>Preferred Payment Method</label>
 <div class="group">
   <input type="radio" id="cod" name="payment" value="Cash on Delivery" class="inline" required>
   <label for="cod">Cash on Delivery</label>
   <input type="radio" id="online" name="payment" value="Online Payment" class="inline" required>
   <label for="online">Online Payment</label>
 </div> <br>

 <!-- Task 8: Additional Services checkboxes -->
 <label>Additional Services</label>
 <div class="group">
   <input type="checkbox" id="gift" name="service" value="Gift Wrapping" class="inline">
   <label for="gift">Gift Wrapping</label>
   <input type="checkbox" id="bookmark" name="service" value="Bookmark" class="inline">
   <label for="bookmark">Bookmark</label>
   <input type="checkbox" id="express" name="service" value="Express Delivery" class="inline">
   <label for="express">Express Delivery</label>
   <input type="checkbox" id="greeting" name="service" value="Greeting Card" class="inline">
   <label for="greeting">Greeting Card</label>
 </div> <br>

 <!-- Task 10: file upload -->
 <label for="file">Upload Reference Image/Document</label>
 <input type="file" id="file" name="reference" accept="image/*,.pdf,.doc,.docx"> <br>

 <!-- Task 11: textarea - Task 3 placeholder also here -->
 <label for="daddress">Delivery Address</label>
 <textarea id="daddress" name="delivery_address" rows="3" placeholder="Enter your full delivery address" required></textarea> <br>

 <label for="special">Special Instructions</label>
 
<textarea id="special" name="special_instructions" rows="3" placeholder="Any special instructions for delivery"></textarea> <br>

 <!-- Task 12: Submit Reset using <button> -->
 <button type="submit" class="submit">Submit Order</button>
 <button type="reset" class="reset">Reset Form</button>

</form>
</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Readers' Haven - Book Registration & Order Form</title>
</head>
<body>
    <h1>Readers' Haven - Book Registration & Order Form</h1>

    <form action="submit_order.php" method="post" target="_self">
        <input type="hidden" name="order_type" value="Readers Haven Book Order">

        <label for="cname">Customer Name:</label><br>
        <input type="text" id="cname" name="cname" placeholder="John Doe"><br><br>

        <label for="cemail">Email Address:</label><br>
        <input type="email" id="cemail" name="cemail" placeholder="john@example.com"><br><br>

        <label for="cmobile">Mobile Number:</label><br>
        <input type="tel" id="cmobile" name="cmobile" placeholder="9876543210"><br><br>

        <label for="cage">Age:</label><br>
        <input type="number" id="cage" name="cage"><br><br>

        <label for="cpass">Password:</label><br>
        <input type="password" id="cpass" name="cpass"><br><br>

        <label for="ddate">Delivery Date:</label><br>
        <input type="date" id="ddate" name="ddate"><br><br>

        <label for="dtime">Preferred Delivery Time:</label><br>
        <input type="time" id="dtime" name="dtime"><br><br>

        <label for="category">Favorite Book Category:</label><br>
        <select id="category" name="category" required>
            <option value="">--Select Category--</option>
            <option value="fiction">Fiction</option>
            <option value="science">Science</option>
            <option value="history">History</option>
            <option value="children">Children's Books</option>
        </select><br><br>

        <label for="title">Book Title:</label><br>
        <input type="text" id="title" name="title"><br><br>

        <label for="qty">Quantity:</label><br>
        <input type="number" id="qty" name="qty" min="1" value="1"><br><br>

        <label>Preferred Payment Method:</label><br>
        <input type="radio" id="cod" name="payment" value="COD">
        <label for="cod">Cash on Delivery</label>
        <input type="radio" id="online" name="payment" value="Online">
        <label for="online">Online Payment</label><br><br>

        <label>Additional Services:</label><br>
        <input type="checkbox" id="gift" name="services" value="Gift Wrapping">
        <label for="gift">Gift Wrapping</label>
        <input type="checkbox" id="bookmark" name="services" value="Bookmark">
        <label for="bookmark">Bookmark</label>
        <input type="checkbox" id="express" name="services" value="Express Delivery">
        <label for="express">Express Delivery</label>
        <input type="checkbox" id="card" name="services" value="Greeting Card">
        <label for="card">Greeting Card</label><br><br>

        <label for="ref_file">Upload Reference Image/Document:</label><br>
        <input type="file" id="ref_file" name="ref_file" accept="image/*,.pdf"><br><br>

        <label for="instructions">Delivery Address & Special Instructions:</label><br>
        <textarea id="instructions" name="instructions" rows="4" cols="35" placeholder="Enter full address and details"></textarea><br><br>

        <button type="submit">Submit Order</button>
        <button type="reset">Reset Form</button>
    </form>
</body>
</html>

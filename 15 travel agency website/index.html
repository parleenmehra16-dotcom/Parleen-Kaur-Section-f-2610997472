<html>
<head>
    <title>Explore the World - Travel Agency</title>
</head>

<!-- Task 2: Divide into 3 horizontal sections Header 20%, Main 65%, Footer 15% -->
<frameset rows="20%,65%,15%" frameborder="1" border="1">

    <!-- Header Frame -->
    <frame src="header.html" name="header_frame" scrolling="no" noresize marginwidth="10" marginheight="10">

    <!-- Task 3: Nested Frameset for Main Content into 3 vertical columns -->
    <frameset cols="25%,45%,30%" frameborder="1" border="1">
        
        <!-- Navigation Frame 25% -->
        <frame src="navigation.html" name="nav_frame" scrolling="yes" noresize marginwidth="10" marginheight="10">

        <!-- Tourist Destinations Frame 45% - This is where pages will open -->
        <frame src="home.html" name="main_frame" scrolling="yes" noresize marginwidth="10" marginheight="10">

        <!-- Travel Packages Frame 30% -->
        <frame src="packages.html" name="package_frame" scrolling="yes" noresize marginwidth="10" marginheight="10">

    </frameset>

    <!-- Footer Frame -->
    <frame src="footer.html" name="footer_frame" scrolling="no" noresize marginwidth="10" marginheight="10">

</frameset>

</html>
